<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本 7 日旅行计划</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: #243447;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8eef5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(100%, 720px);
      padding: 40px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 16px 48px rgba(36, 52, 71, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 6vw, 40px);
    }

    p {
      margin: 0 0 32px;
      color: #64748b;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 16px;
    }

    a {
      display: block;
      padding: 22px 24px;
      border: 1px solid #dbe4ee;
      border-radius: 14px;
      color: inherit;
      background: #fff;
      text-decoration: none;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: #4f7cac;
      box-shadow: 0 8px 24px rgba(79, 124, 172, 0.14);
    }

    a:focus-visible {
      outline: 3px solid #4f7cac;
      outline-offset: 3px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      color: #4f7cac;
      font-size: 14px;
      font-weight: 600;
    }

    .title {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.5;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>日本 7 日旅行计划</h1>
    <p>横滨、东京与镰仓的行程安排和互动地图，请选择下面一个版本查看。</p>
    <nav class="links" aria-label="旅行计划版本">
      <a href="deepseek.html">
        <span class="label">DeepSeek</span>
        <span class="title">横滨 · 镰仓 · 东京 7 日行程互动地图</span>
      </a>
      <a href="gemini.html">
        <span class="label">Gemini · 11/29—12/05</span>
        <span class="title">横滨 + 东京 + 镰仓 7 天行程交互地图</span>
      </a>
      <a href="gemini-v2.html">
        <span class="label">Gemini v2 · 11/29—12/05</span>
        <span class="title">横滨 + 东京 + 镰仓 · P5 + 如龙 + 命运石之门</span>
      </a>
    </nav>
  </main>
</body>
</html>
